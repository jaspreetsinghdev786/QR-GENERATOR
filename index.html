<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>QR Code Generator</h1>
    <form id="qr-form">
      <label for="text">Text or URL</label>
      <input id="text" type="text" placeholder="https://example.com" required autofocus>
      <div class="row">
        <label>Size
          <select id="size">
            <option value="200">200 px</option>
            <option value="300" selected>300 px</option>
            <option value="400">400 px</option>
          </select>
        </label>
        <label>Color <input id="color" type="color" value="#000000"></label>
      </div>
      <button type="submit">Generate</button>
    </form>
    <div id="output"></div>
    <a id="download" class="btn" hidden download="qr.png">Download PNG</a>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
